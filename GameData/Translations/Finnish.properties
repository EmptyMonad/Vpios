Fastlane_short_description = Avoimen lähdekoodin 4X sivilisaationrakennuspeli
Fastlane_full_description = Kaikkien aikojen kuuluisimman sivilisaationrakennuspelin avoimen lähdekoodin uudelleentoteutus - nopea, pieni, ei mainoksia, ilmainen ikuisesti!\n\nRakenna sivilisaatiotasi, tutki teknologioita, laajenna kaupunkejasi ja kukista vihollisesi!\n\nPyyntöjä? Bugeja? Haluatko auttaa kehityksessä? Tehtävälista sovellukselle on https://github.com/yairm210/Unciv/issues\n\nKysymyksiä? Kommentteja? Liity meihin discordissa osoitteessa https://discord.gg/bjrB4Xw ;)\n\nHaluatko auttaa pelin kääntämisessä sinun kielellesi? Katso https://yairm210.github.io/Unciv/Translating/Translating/\n\nMaailma odottaa! Rakennatko sivilisaatiostasi imperiumin, joka kestää ajan koetuksen?\n\nTäysi verkkoyhteys -oikeus vaaditaan käyttäjän aloittamiin latauksiin ja moninpelitoimintoon. Kaikki muut listatut oikeudet on automaattisesti sisällytetty käytetyn API:n toimesta moninpelin vuoroilmoitusten toteuttamiseksi. Verkko-oikeuksia käytetään listaamaan modit, lataamaan modeja, lataamaan musiikkia ja lähettämään/lataamaan moninpelejä. Mitään muuta internetliikennettä ei käynnistetä Uncivin toimesta.
