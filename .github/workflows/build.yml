name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          brew install xcodegen >/dev/null
          ls -d /Applications/Xcode*.app | tee xcodes.txt
          NEWEST=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | sort -V | tail -1 | cut -d' ' -f2)
          echo "selecting $NEWEST"; sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version | tee toolchain.txt
          swift --version | tee -a toolchain.txt
      - name: JVM-order primitives vs JVM reference
        id: jvmcheck
        continue-on-error: true
        run: |
          set -o pipefail
          swiftc -O -o jvmcheck Shell/JavaCompat.swift ci/jvmcheck/main.swift 2>&1 | tee jvmcheck.log
          ./jvmcheck ci/jvmcheck 2>&1 | tee -a jvmcheck.log
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build (simulator, unsigned)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project VPiOS.xcodeproj -scheme VPiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -IDEBuildingContinueBuildingAfterErrors=YES \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' build 2>&1 | tee build.log
      - name: Smoke test (simulator launch + screenshot)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          xcrun simctl list runtimes | tee smoke.log
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ios=[k for k in d if 'iOS' in k]; ios.sort(); devs=[x for k in reversed(ios) for x in d[k] if 'iPhone' in x['name']]; print(devs[0]['udid'])")
          echo "device $DEV" | tee -a smoke.log
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" dd/Build/Products/Debug-iphonesimulator/VPiOS.app
          xcrun simctl launch --console-pty "$DEV" com.emptymonad.vpios > app-console.log 2>&1 &
          sleep 25
          xcrun simctl io "$DEV" screenshot smoke-25s.png
          if xcrun simctl spawn "$DEV" launchctl list | grep -q com.emptymonad.vpios; then echo "ALIVE after 25s" | tee -a smoke.log; else echo "NOT RUNNING after 25s" | tee -a smoke.log; fi
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i vpios | tee -a smoke.log || true
          for f in ~/Library/Logs/DiagnosticReports/*VPiOS*; do [ -f "$f" ] && head -c 20000 "$f" > crash.txt; done
          tail -c 30000 app-console.log > app-console-tail.log
          # VP self-test: an all-AI G&K + BNW + VP game, happiness printed every 10 turns
          xcrun simctl terminate "$DEV" com.emptymonad.vpios || true
          xcrun simctl launch --console-pty "$DEV" com.emptymonad.vpios -vpSelfTest 80 > vptest-console.log 2>&1 &
          for i in $(seq 1 90); do grep -q "VPTEST done\|VPTEST could not" vptest-console.log && break; sleep 10; done
          grep "VPTEST" vptest-console.log > vptest.log || true
          tail -c 20000 vptest-console.log > vptest-console-tail.log
          for f in ~/Library/Logs/DiagnosticReports/*VPiOS*; do [ -f "$f" ] && head -c 20000 "$f" > crash.txt; done
      - name: Build unsigned IPA
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild -project VPiOS.xcodeproj -scheme VPiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ddr \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -20
          mkdir -p Payload && cp -R ddr/Build/Products/Release-iphoneos/VPiOS.app Payload/
          zip -qry VPiOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: VPiOS-unsigned-ipa
          path: VPiOS-unsigned.ipa
      - name: Publish build report to ci-logs branch
        if: always()
        env:
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p report
          { echo "commit $SHA"; echo "outcome $OUTCOME"; cat toolchain.txt; } > report/summary.txt
          cp jvmcheck.log report/ 2>/dev/null || true
          cp smoke.log smoke-25s.png app-console-tail.log crash.txt vptest.log vptest-console-tail.log report/ 2>/dev/null || true
          grep -E "^/.*: (error|fatal error):" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > report/errors.txt || true
          grep -cE ": error:" build.log >> report/summary.txt || true
          wc -l < report/errors.txt >> report/summary.txt
          tail -c 200000 build.log | sed "s#$GITHUB_WORKSPACE/##g" > report/build-tail.log
          git config --global user.name "vpios-ci"; git config --global user.email "ci@users.noreply.github.com"
          git clone --quiet --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs 2>/dev/null \
            || { git init -q logs && git -C logs checkout -q -b ci-logs && git -C logs remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          rm -rf logs/latest && mkdir -p logs/latest && cp report/* logs/latest/
          git -C logs add -A && git -C logs commit -qm "build $SHA: $OUTCOME" && git -C logs push -q origin ci-logs
